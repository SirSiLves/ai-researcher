<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Trend Radar</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #11141c;
      --surface-2: #161a24;
      --border: #232836;
      --border-strong: #2f3547;
      --text: #e7eaf2;
      --text-dim: #aab0c0;
      --muted: #6b7384;
      --accent: #6aa9ff;
      --rising: #58c97f;
      --falling: #ff8a8a;
      --emerging: #ffb84d;
      --consolidating: #6aa9ff;
      --mainstream: #58c97f;
      --fading: #8a91a3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; }

    /* -------- top bar -------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .topbar h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .topbar .meta {
      color: var(--text-dim);
      font-size: 12px;
    }
    .topbar .meta .sep { color: var(--border-strong); margin: 0 8px; }
    .topbar .spacer { flex: 1; }
    .topbar select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 26px 5px 10px;
      font: inherit;
      font-size: 12px;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .topbar select:hover { border-color: var(--border-strong); }
    .topbar .links {
      display: flex;
      gap: 16px;
      font-size: 12px;
    }
    .topbar .links a { color: var(--text-dim); }
    .topbar .links a:hover { color: var(--accent); }

    /* -------- layout -------- */
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 28px 48px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .row-2 { grid-template-columns: 1fr; }
    }

    /* -------- card primitive -------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .card-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-head .hint {
      font-size: 11px;
      color: var(--muted);
    }
    .card-body { padding: 4px 0; }
    .card-body.padded { padding: 14px 16px; }

    /* -------- "what moved today" list -------- */
    .moves { list-style: none; margin: 0; padding: 0; }
    .moves li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: baseline;
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.08s;
    }
    .moves li:last-child { border-bottom: none; }
    .moves li:hover { background: var(--surface-2); }
    .moves .title {
      font-weight: 500;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .moves .meta {
      color: var(--text-dim);
      font-size: 11px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .moves .tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding-left: 12px;
      align-self: center;
    }
    .moves .tag.up { color: var(--rising); }
    .moves .tag.down { color: var(--falling); }
    .moves .tag.new { color: var(--accent); }
    .moves .tag.hot { color: var(--emerging); }
    .moves .tag.shift { color: #5cd0d0; }
    .moves .tag.breadth { color: #b48aff; }

    .empty {
      padding: 24px 16px;
      color: var(--muted);
      font-style: italic;
      text-align: center;
      font-size: 12px;
    }

    /* -------- sector cards -------- */
    .sectors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      padding: 16px;
    }
    .sector-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.08s, background 0.08s;
    }
    .sector-card:hover { border-color: var(--border-strong); }
    .sector-card.active {
      border-color: var(--accent);
      background: rgba(106, 169, 255, 0.06);
    }
    .sector-card .name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .sector-card .stats {
      display: flex;
      gap: 10px;
      align-items: baseline;
      color: var(--text-dim);
      font-size: 11px;
    }
    .sector-card .count {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .sector-card .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* -------- topics table -------- */
    .table-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .table-toolbar input {
      flex: 1;
      max-width: 260px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font: inherit;
      font-size: 12px;
    }
    .table-toolbar input::placeholder { color: var(--muted); }
    .table-toolbar input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .table-toolbar select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 26px 5px 10px;
      font: inherit;
      font-size: 12px;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .table-toolbar .clear {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .table-toolbar .clear:hover { color: var(--text); border-color: var(--border-strong); }
    .table-toolbar .count {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    table.topics {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    table.topics th {
      text-align: left;
      font-weight: 600;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    table.topics th.right { text-align: right; }
    table.topics th .sortarr { color: var(--text-dim); margin-left: 4px; font-size: 9px; }
    table.topics th.inactive .sortarr { opacity: 0; }
    table.topics th:hover { color: var(--text-dim); }

    table.topics td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.topics td.right {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    table.topics tr.row-main { cursor: pointer; }
    table.topics tr.row-main:hover { background: var(--surface-2); }
    table.topics tr.row-main.expanded { background: var(--surface-2); }
    table.topics td.topic-label {
      max-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    table.topics .stage-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    table.topics .stage-pill.emerging      { color: var(--emerging); border-color: rgba(255, 184, 77, 0.4); }
    table.topics .stage-pill.consolidating { color: var(--consolidating); border-color: rgba(106, 169, 255, 0.4); }
    table.topics .stage-pill.mainstream    { color: var(--mainstream); border-color: rgba(88, 201, 127, 0.4); }
    table.topics .stage-pill.fading        { color: var(--fading); border-color: rgba(138, 145, 163, 0.4); }
    table.topics .dir { font-weight: 600; }
    table.topics .dir.rising  { color: var(--rising); }
    table.topics .dir.surging { color: var(--rising); }
    table.topics .dir.fading  { color: var(--falling); }
    table.topics .dir.steady  { color: var(--muted); }
    table.topics .caret {
      color: var(--muted);
      display: inline-block;
      transition: transform 0.12s;
      font-size: 10px;
      margin-right: 6px;
    }
    table.topics tr.row-main.expanded .caret { transform: rotate(90deg); }

    /* expanded detail row */
    tr.row-detail td {
      padding: 0;
      background: var(--surface-2);
    }
    .detail-wrap {
      padding: 14px 16px 16px 32px;
      border-bottom: 1px solid var(--border);
    }
    .detail-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .detail-stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 10px;
    }
    .detail-stat .l {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .detail-stat .v {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .detail-stat .v.dim { color: var(--muted); font-size: 12px; font-weight: 400; font-style: italic; }
    .detail-section {
      margin-top: 12px;
    }
    .detail-section h4 {
      margin: 0 0 6px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }
    .org-pill {
      display: inline-block;
      padding: 1px 8px;
      margin: 0 4px 4px 0;
      border-radius: 3px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--text);
    }
    .org-pill:hover { border-color: var(--accent); color: var(--accent); }
    .org-pill.priority { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .detail-section code {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      padding: 1px 0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .detail-chart {
      position: relative;
      height: 180px;
      margin-top: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px;
    }

    /* -------- top history chart card -------- */
    .chart-wrap {
      position: relative;
      height: 280px;
      padding: 14px 16px 16px;
    }

    /* -------- error -------- */
    .error {
      background: rgba(255, 138, 138, 0.08);
      border: 1px solid var(--falling);
      color: var(--falling);
      padding: 12px 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>AI Trend Radar</h1>
    <div class="meta" id="meta-line"></div>
    <div class="spacer"></div>
    <label class="meta">Snapshot
      <select id="date-select" style="margin-left:6px;"></select>
    </label>
    <div class="links">
      <a href="orgs.html">Firm view</a>
      <a href="index.md">Index</a>
    </div>
  </div>

  <main id="main">
    <section class="row-2">
      <div class="card">
        <div class="card-head">
          <h2>What moved today</h2>
          <span class="hint" id="moved-count"></span>
        </div>
        <div class="card-body">
          <ul class="moves" id="moves-list"></ul>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Sectors</h2>
          <span class="hint" id="sectors-hint"></span>
        </div>
        <div class="sectors-grid" id="sectors-grid"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Topics</h2>
        <span class="hint">Click a row for details</span>
      </div>
      <div class="table-toolbar">
        <input type="text" id="topic-search" placeholder="Search topics…">
        <select id="sector-filter"><option value="">All sectors</option></select>
        <button class="clear" id="clear-filters">Clear</button>
        <span class="count" id="topic-count"></span>
      </div>
      <table class="topics" id="topics-table">
        <thead>
          <tr>
            <th data-sort="label">Topic <span class="sortarr">▾</span></th>
            <th data-sort="sector">Sector <span class="sortarr">▾</span></th>
            <th data-sort="stage">Stage <span class="sortarr">▾</span></th>
            <th class="right" data-sort="score_slow">Score <span class="sortarr">▾</span></th>
            <th class="right" data-sort="direction">Dir <span class="sortarr">▾</span></th>
            <th class="right" data-sort="breadth_7d">Breadth <span class="sortarr">▾</span></th>
            <th class="right" data-sort="sustained_days">Days <span class="sortarr">▾</span></th>
          </tr>
        </thead>
        <tbody id="topics-body"></tbody>
      </table>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Top 8 by score · history</h2>
        <span class="hint" id="history-hint"></span>
      </div>
      <div class="chart-wrap"><canvas id="top-history-chart"></canvas></div>
    </section>
  </main>

  <script>
    // ====================================================================
    // State
    // ====================================================================
    const state = {
      manifest: null,
      currentEntry: null,
      currentData: null,
      priorData: null,
      cache: new Map(),
      orgs: null,
      sectorFilter: '',
      search: '',
      sortBy: 'score_slow',
      sortDir: 'desc',
      expanded: new Set(),     // topic ids open in the detail row
      topHistoryChart: null,
      detailCharts: new Map(), // topicId -> Chart instance
    };

    const STAGE_RANK = { fading: 0, emerging: 1, consolidating: 2, mainstream: 3 };
    const DIR_RANK   = { fading: 0, steady: 1, rising: 2, surging: 3 };
    const DIR_GLYPH  = { surging: '↑↑', rising: '↑', steady: '→', fading: '↓' };

    // ====================================================================
    // Boot
    // ====================================================================
    async function init() {
      try {
        const r = await fetch('radar/index.json');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        state.manifest = await r.json();
      } catch (e) {
        showError(`Could not load radar/index.json: ${e.message}\n\nLikely cause: opened via file://. Serve over localhost.`);
        return;
      }

      // Optional side data (orgs metadata for priority pills)
      try {
        const r = await fetch('orgs/index.json');
        if (r.ok) {
          const d = await r.json();
          state.orgs = new Map(d.entries.map(e => [e.slug, e]));
        }
      } catch (_) { /* optional */ }

      const sel = document.getElementById('date-select');
      state.manifest.entries.forEach(entry => {
        const opt = document.createElement('option');
        opt.value = entry.date_id;
        opt.textContent = `${entry.date_id} · ${entry.topic_count} topics`;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => loadDate(sel.value));

      document.getElementById('topic-search').addEventListener('input', e => {
        state.search = e.target.value.toLowerCase().trim();
        renderTopics();
      });
      document.getElementById('sector-filter').addEventListener('change', e => {
        state.sectorFilter = e.target.value;
        renderTopics();
        renderSectors();
      });
      document.getElementById('clear-filters').addEventListener('click', () => {
        state.search = '';
        state.sectorFilter = '';
        document.getElementById('topic-search').value = '';
        document.getElementById('sector-filter').value = '';
        renderTopics();
        renderSectors();
      });
      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const col = th.dataset.sort;
          if (state.sortBy === col) {
            state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
          } else {
            state.sortBy = col;
            state.sortDir = (col === 'label' || col === 'sector' || col === 'stage') ? 'asc' : 'desc';
          }
          renderTopics();
        });
      });

      if (!state.manifest.entries.length) {
        showError('No radar entries in manifest.');
        return;
      }
      await loadDate(state.manifest.entries[0].date_id);
      await preloadAll();
    }

    async function loadJson(date_id) {
      if (state.cache.has(date_id)) return state.cache.get(date_id);
      const entry = state.manifest.entries.find(e => e.date_id === date_id);
      if (!entry) throw new Error(`${date_id} not in manifest`);
      const r = await fetch(entry.json_path);
      if (!r.ok) throw new Error(`${entry.json_path} HTTP ${r.status}`);
      const data = await r.json();
      state.cache.set(date_id, data);
      return data;
    }

    async function preloadAll() {
      await Promise.allSettled(state.manifest.entries.map(e => loadJson(e.date_id)));
      renderTopHistory();
    }

    async function loadDate(date_id) {
      state.currentEntry = state.manifest.entries.find(e => e.date_id === date_id);
      state.currentData = await loadJson(date_id);
      state.priorData = null;
      if (state.currentData.prior_radar) {
        const priorId = state.currentData.prior_radar.split('/').pop().replace('.json', '');
        try { state.priorData = await loadJson(priorId); } catch (_) {}
      }
      state.expanded.clear();
      renderAll();
    }

    function renderAll() {
      renderMeta();
      renderSectorFilterOptions();
      renderMoves();
      renderSectors();
      renderTopics();
      renderTopHistory();
    }

    // ====================================================================
    // Meta line
    // ====================================================================
    function renderMeta() {
      const d = state.currentData;
      const parts = [
        d.date,
        `${(d.topics || []).length} topics`,
        `${(d.sectors || []).length} sectors`,
      ];
      document.getElementById('meta-line').innerHTML =
        parts.map(escHtml).join('<span class="sep">·</span>');
    }

    function renderSectorFilterOptions() {
      const sel = document.getElementById('sector-filter');
      const current = state.sectorFilter;
      const names = (state.currentData.sectors || []).map(s => s.name).sort();
      sel.innerHTML = '<option value="">All sectors</option>' +
        names.map(n => `<option value="${escAttr(n)}"${n === current ? ' selected' : ''}>${escHtml(n)}</option>`).join('');
    }

    // ====================================================================
    // What moved today
    // ====================================================================
    function renderMoves() {
      const d = state.currentData;
      const topicById = new Map((d.topics || []).map(t => [t.id, t]));
      const items = [];
      const seen = new Set();

      // Stage movements (highest weight)
      (d.stage_movements || []).forEach(m => {
        const t = topicById.get(m.topic);
        if (!t) return;
        seen.add(t.id);
        const isFade = m.to === 'fading';
        const isForward = STAGE_RANK[m.to] > STAGE_RANK[m.from];
        const fromLabel = m.from || 'new';
        items.push({
          weight: isFade ? 90 : 100,
          title: t.label || t.id,
          meta: `${fromLabel} → ${m.to} · ${t.sector || 'no sector'}`,
          tagLabel: isFade ? 'Fade' : (m.from ? 'Stage' : 'First seen'),
          tagClass: isFade ? 'down' : (isForward ? 'up' : 'shift'),
          topicId: t.id,
        });
      });

      // Surging topics
      (d.topics || []).forEach(t => {
        if (seen.has(t.id)) return;
        const fast = t.score_fast != null ? t.score_fast : t.score;
        const slow = t.score_slow != null ? t.score_slow : t.score;
        const isSurge = t.direction === 'surging' || (slow > 0 && fast / slow >= 1.5);
        if (!isSurge) return;
        seen.add(t.id);
        const pct = slow > 0 ? Math.round((fast / slow - 1) * 100) : null;
        items.push({
          weight: 75,
          title: t.label || t.id,
          meta: `${t.sector || 'no sector'} · fast ${fast.toFixed(1)} / slow ${slow.toFixed(1)}${pct != null ? ` (+${pct}%)` : ''}`,
          tagLabel: 'Surge',
          tagClass: 'up',
          topicId: t.id,
        });
      });

      // Sector births / deaths
      (d.sectors_spawned_today || []).forEach(name => {
        items.push({
          weight: 85,
          title: name,
          meta: 'New sector clustered today',
          tagLabel: 'New sector',
          tagClass: 'new',
          sectorName: name,
        });
      });
      (d.sectors_dissolved_today || []).forEach(name => {
        items.push({
          weight: 70,
          title: name,
          meta: 'Topics scattered to other sectors',
          tagLabel: 'Dissolved',
          tagClass: 'down',
          sectorName: name,
        });
      });

      // Sector reassignments
      (d.sector_movements || []).forEach(m => {
        const t = topicById.get(m.topic);
        if (!t || seen.has(t.id)) return;
        seen.add(t.id);
        items.push({
          weight: 80,
          title: t.label || t.id,
          meta: `${m.from || '—'} → ${m.to || '?'}${m.reason ? ' · ' + m.reason : ''}`,
          tagLabel: 'Sector shift',
          tagClass: 'shift',
          topicId: t.id,
        });
      });

      // Breadth jumps vs prior radar
      if (state.priorData) {
        const priorById = new Map((state.priorData.topics || []).map(t => [t.id, t]));
        (d.topics || []).forEach(t => {
          if (seen.has(t.id)) return;
          const prior = priorById.get(t.id);
          if (!prior) return;
          const now = t.breadth_7d || 0;
          const was = prior.breadth_7d || 0;
          if (now >= 5 && now >= was * 1.5 && now - was >= 2) {
            seen.add(t.id);
            const pct = Math.round((now / Math.max(was, 1) - 1) * 100);
            items.push({
              weight: 60,
              title: t.label || t.id,
              meta: `${was} → ${now} orgs (+${pct}%) · ${t.sector || 'no sector'}`,
              tagLabel: 'Breadth',
              tagClass: 'breadth',
              topicId: t.id,
            });
          }
        });
      }

      items.sort((a, b) => b.weight - a.weight);
      const top = items.slice(0, 8);

      const el = document.getElementById('moves-list');
      document.getElementById('moved-count').textContent = top.length ? `${top.length} of ${items.length}` : '';
      if (!top.length) {
        el.innerHTML = `<li><div class="empty">Quiet day. No promotions, surges, or sector changes.</div></li>`;
        return;
      }
      el.innerHTML = top.map(item => `
        <li ${item.topicId ? `data-topic-id="${escAttr(item.topicId)}"` : ''} ${item.sectorName ? `data-sector="${escAttr(item.sectorName)}"` : ''}>
          <div>
            <div class="title">${escHtml(item.title)}</div>
            <div class="meta">${escHtml(item.meta)}</div>
          </div>
          <div class="tag ${item.tagClass}">${escHtml(item.tagLabel)}</div>
        </li>`).join('');

      el.querySelectorAll('li[data-topic-id]').forEach(li => {
        li.addEventListener('click', () => {
          const id = li.dataset.topicId;
          state.expanded.add(id);
          renderTopics();
          // Scroll the row into view
          requestAnimationFrame(() => {
            const row = document.querySelector(`tr.row-main[data-id="${CSS.escape(id)}"]`);
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
        });
      });
      el.querySelectorAll('li[data-sector]').forEach(li => {
        li.addEventListener('click', () => {
          state.sectorFilter = li.dataset.sector;
          document.getElementById('sector-filter').value = state.sectorFilter;
          renderTopics();
          renderSectors();
        });
      });
    }

    // ====================================================================
    // Sector cards
    // ====================================================================
    function renderSectors() {
      const el = document.getElementById('sectors-grid');
      const sectors = (state.currentData.sectors || []).slice()
        .sort((a, b) => (b.topic_count || 0) - (a.topic_count || 0));
      document.getElementById('sectors-hint').textContent = sectors.length ? `${sectors.length} active` : '';
      if (!sectors.length) {
        el.innerHTML = `<div class="empty" style="grid-column:1/-1">No sectors yet.</div>`;
        return;
      }
      const topicsBySector = new Map();
      (state.currentData.topics || []).forEach(t => {
        if (!topicsBySector.has(t.sector)) topicsBySector.set(t.sector, []);
        topicsBySector.get(t.sector).push(t);
      });
      el.innerHTML = sectors.map(s => {
        const topics = topicsBySector.get(s.name) || [];
        const rising = topics.filter(t => t.direction === 'rising' || t.direction === 'surging').length;
        const active = state.sectorFilter === s.name ? 'active' : '';
        return `<div class="sector-card ${active}" data-name="${escAttr(s.name)}">
          <div class="name">${escHtml(s.name)}</div>
          <div class="stats">
            <span class="count">${s.topic_count || 0}</span>
            <span class="label">topics</span>
            ${rising ? `<span style="margin-left:auto; color:var(--rising); font-size:11px; font-weight:600;">${rising} rising</span>` : ''}
          </div>
        </div>`;
      }).join('');
      el.querySelectorAll('.sector-card').forEach(card => {
        card.addEventListener('click', () => {
          const name = card.dataset.name;
          state.sectorFilter = (state.sectorFilter === name) ? '' : name;
          document.getElementById('sector-filter').value = state.sectorFilter;
          renderTopics();
          renderSectors();
        });
      });
    }

    // ====================================================================
    // Topics table
    // ====================================================================
    function filteredTopics() {
      let topics = (state.currentData.topics || []).slice();
      if (state.sectorFilter) topics = topics.filter(t => t.sector === state.sectorFilter);
      if (state.search) {
        topics = topics.filter(t =>
          (t.label || '').toLowerCase().includes(state.search) ||
          (t.id || '').toLowerCase().includes(state.search)
        );
      }
      const dir = state.sortDir === 'desc' ? -1 : 1;
      const k = state.sortBy;
      topics.sort((a, b) => {
        let av, bv;
        if (k === 'stage') { av = STAGE_RANK[a.stage] ?? -1; bv = STAGE_RANK[b.stage] ?? -1; }
        else if (k === 'direction') { av = DIR_RANK[a.direction] ?? -1; bv = DIR_RANK[b.direction] ?? -1; }
        else if (k === 'label' || k === 'sector') {
          av = (a[k] || '').toLowerCase(); bv = (b[k] || '').toLowerCase();
          if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0;
        } else {
          av = a[k] ?? -Infinity; bv = b[k] ?? -Infinity;
        }
        return (av - bv) * dir;
      });
      return topics;
    }

    function renderTopics() {
      const tbody = document.getElementById('topics-body');
      const topics = filteredTopics();
      document.getElementById('topic-count').textContent =
        `${topics.length} of ${(state.currentData.topics || []).length}`;

      // sort header arrows
      document.querySelectorAll('th[data-sort]').forEach(th => {
        const active = th.dataset.sort === state.sortBy;
        th.classList.toggle('inactive', !active);
        const arr = th.querySelector('.sortarr');
        if (arr) arr.textContent = active ? (state.sortDir === 'desc' ? '▾' : '▴') : '▾';
      });

      // Destroy old detail charts before rerendering
      state.detailCharts.forEach(c => c.destroy());
      state.detailCharts.clear();

      if (!topics.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">No topics match.</td></tr>`;
        return;
      }

      tbody.innerHTML = topics.map(t => {
        const isOpen = state.expanded.has(t.id);
        const dir = t.direction || 'steady';
        const arrow = DIR_GLYPH[dir] || '→';
        const score = (t.score_slow != null ? t.score_slow : t.score) || 0;
        return `
          <tr class="row-main ${isOpen ? 'expanded' : ''}" data-id="${escAttr(t.id)}">
            <td class="topic-label"><span class="caret">▸</span>${escHtml(t.label || t.id)}</td>
            <td>${escHtml(t.sector || '—')}</td>
            <td><span class="stage-pill ${t.stage}">${escHtml(t.stage || '—')}</span></td>
            <td class="right">${score.toFixed(1)}</td>
            <td class="right dir ${dir}">${arrow}</td>
            <td class="right">${t.breadth_7d != null ? t.breadth_7d : '—'}</td>
            <td class="right">${t.sustained_days != null ? t.sustained_days : '—'}</td>
          </tr>
          ${isOpen ? `<tr class="row-detail" data-id="${escAttr(t.id)}"><td colspan="7">${detailHtml(t)}</td></tr>` : ''}
        `;
      }).join('');

      tbody.querySelectorAll('tr.row-main').forEach(tr => {
        tr.addEventListener('click', () => {
          const id = tr.dataset.id;
          if (state.expanded.has(id)) state.expanded.delete(id);
          else state.expanded.add(id);
          renderTopics();
        });
      });

      // Render detail charts for any expanded rows
      state.expanded.forEach(id => renderDetailChart(id));
    }

    function detailHtml(t) {
      const runs = [...state.cache.values()].sort((a, b) => a.date.localeCompare(b.date));
      const ageDays = runs.length ? Math.round((new Date(state.currentData.date) - new Date(runs[0].date)) / 86400000) : 0;

      const statHtml = (label, val, requiresDays) => {
        if (val == null) {
          const isCold = ageDays < requiresDays;
          return `<div class="detail-stat"><div class="l">${escHtml(label)}</div><div class="v dim">${isCold ? `cold (${requiresDays}d)` : '—'}</div></div>`;
        }
        return `<div class="detail-stat"><div class="l">${escHtml(label)}</div><div class="v">${val.toFixed(1)}</div></div>`;
      };

      const stats = `
        <div class="detail-stat"><div class="l">Score (slow)</div><div class="v">${((t.score_slow != null ? t.score_slow : t.score) || 0).toFixed(1)}</div></div>
        ${statHtml('7d ago', t.score_7d_ago, 7)}
        ${statHtml('30d ago', t.score_30d_ago, 30)}
        ${statHtml('90d ago', t.score_90d_ago, 90)}
        ${statHtml('180d ago', t.score_180d_ago, 180)}
        <div class="detail-stat"><div class="l">Sustained</div><div class="v">${t.sustained_days != null ? t.sustained_days + 'd' : '—'}</div></div>
        <div class="detail-stat"><div class="l">Breadth 7d</div><div class="v">${t.breadth_7d != null ? t.breadth_7d : '—'}</div></div>
        <div class="detail-stat"><div class="l">Convergence</div><div class="v">${t.convergence_multiplier_applied != null ? '×' + Number(t.convergence_multiplier_applied).toFixed(1) : '—'}</div></div>
      `;

      const orgs = (t.breadth_orgs_7d || []).slice(0, 18).map(o => orgPill(o)).join(' ');
      const sectorHistory = (t.sector_history || []).slice(-5).map(h =>
        `<div style="font-size:11px; color:var(--text-dim); padding:1px 0">${escHtml(h.date)}: ${escHtml(h.from || '—')} → ${escHtml(h.to)}${h.reason ? ' · ' + escHtml(h.reason) : ''}</div>`
      ).join('');
      const files = (t.supporting_files || []).slice(0, 8).map(f => `<code>${escHtml(f)}</code>`).join('');

      return `<div class="detail-wrap">
        <div class="detail-stats">${stats}</div>
        <div class="detail-chart"><canvas data-detail-canvas="${escAttr(t.id)}"></canvas></div>
        ${orgs ? `<div class="detail-section"><h4>Orgs talking (7d)</h4><div>${orgs}</div></div>` : ''}
        ${sectorHistory ? `<div class="detail-section"><h4>Sector history</h4>${sectorHistory}</div>` : ''}
        ${files ? `<div class="detail-section"><h4>Supporting files</h4><div>${files}</div></div>` : ''}
      </div>`;
    }

    function renderDetailChart(topicId) {
      const canvas = document.querySelector(`canvas[data-detail-canvas="${CSS.escape(topicId)}"]`);
      if (!canvas) return;
      const runs = [...state.cache.values()].sort((a, b) => a.date.localeCompare(b.date));
      if (runs.length < 2) return;
      const labels = runs.map(r => r.date);
      const scores = runs.map(r => {
        const m = (r.topics || []).find(x => x.id === topicId);
        return m ? (m.score_slow != null ? m.score_slow : m.score) : null;
      });
      const breadth = runs.map(r => {
        const m = (r.topics || []).find(x => x.id === topicId);
        return m ? (m.breadth_7d || 0) : null;
      });
      const chart = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Score (slow)', data: scores,
            borderColor: '#6aa9ff', backgroundColor: 'rgba(106,169,255,0.10)',
            tension: 0.25, spanGaps: true, fill: true, yAxisID: 'y',
          }, {
            label: 'Breadth (orgs 7d)', data: breadth,
            borderColor: '#58c97f', backgroundColor: 'transparent',
            tension: 0.25, spanGaps: true, borderDash: [4, 4], yAxisID: 'y1',
          }],
        },
        options: chartOptionsDualAxis(),
      });
      state.detailCharts.set(topicId, chart);
    }

    function orgPill(slug) {
      const meta = state.orgs ? state.orgs.get(slug) : null;
      const cls = meta && meta.is_priority ? 'org-pill priority' : 'org-pill';
      const tip = meta ? `${meta.total_mentions} mentions · ${meta.distinct_days}d · velocity ${meta.velocity_ratio}×` : '';
      return `<a class="${cls}" href="orgs.html?slug=${encodeURIComponent(slug)}" title="${escAttr(tip)}">${escHtml(slug)}</a>`;
    }

    // ====================================================================
    // Top history chart
    // ====================================================================
    function renderTopHistory() {
      const canvas = document.getElementById('top-history-chart');
      if (!canvas) return;
      const runs = [...state.cache.values()].sort((a, b) => a.date.localeCompare(b.date));
      const hint = document.getElementById('history-hint');
      if (runs.length < 2) {
        if (state.topHistoryChart) { state.topHistoryChart.destroy(); state.topHistoryChart = null; }
        hint.textContent = 'Need ≥2 snapshots';
        return;
      }
      hint.textContent = `${runs.length} snapshots`;
      const top = filteredTopics().slice(0, 8);
      const palette = ['#6aa9ff', '#ffb84d', '#b48aff', '#5cd0d0', '#58c97f', '#ff8a8a', '#b8bdc8', '#ffa17a'];
      const datasets = top.map((t, i) => ({
        label: t.label || t.id,
        data: runs.map(r => {
          const m = (r.topics || []).find(x => x.id === t.id);
          return m ? (m.score_slow != null ? m.score_slow : m.score) : null;
        }),
        borderColor: palette[i % palette.length],
        backgroundColor: palette[i % palette.length] + '22',
        tension: 0.25,
        spanGaps: true,
        borderWidth: 1.6,
      }));
      if (state.topHistoryChart) state.topHistoryChart.destroy();
      state.topHistoryChart = new Chart(canvas, {
        type: 'line',
        data: { labels: runs.map(r => r.date), datasets },
        options: chartOptionsSingleAxis(),
      });
    }

    function chartOptionsSingleAxis() {
      return {
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#aab0c0', boxWidth: 8, font: { size: 11 }, usePointStyle: true, pointStyle: 'line' },
          },
        },
        scales: {
          x: { ticks: { color: '#6b7384', font: { size: 10 } }, grid: { color: '#232836' } },
          y: { beginAtZero: true, ticks: { color: '#6b7384', font: { size: 10 } }, grid: { color: '#232836' } },
        },
      };
    }
    function chartOptionsDualAxis() {
      return {
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#aab0c0', boxWidth: 8, font: { size: 10 }, usePointStyle: true, pointStyle: 'line' },
          },
        },
        scales: {
          x: { ticks: { color: '#6b7384', font: { size: 10 } }, grid: { color: '#232836' } },
          y:  { position: 'left', beginAtZero: true, ticks: { color: '#6aa9ff', font: { size: 10 } }, grid: { color: '#232836' } },
          y1: { position: 'right', beginAtZero: true, ticks: { color: '#58c97f', font: { size: 10 } }, grid: { display: false } },
        },
      };
    }

    // ====================================================================
    // Helpers
    // ====================================================================
    function showError(msg) {
      document.getElementById('main').innerHTML = `<div class="error">${escHtml(msg)}</div>`;
    }
    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escAttr(s) { return escHtml(s); }

    init();
  </script>
</body>
</html>
