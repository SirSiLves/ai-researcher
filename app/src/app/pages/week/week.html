<section class="page week">
  <app-page-header
      title="Weekly digest"
      [subtitle]="current()?.headline || 'Cumulative Mon→Sun rollup of the daily briefings'"
      [model]="[{label:'Briefing'}, {label:'Weekly'}]">
    <button pButton type="button" text size="small"
            (click)="prev()" [disabled]="!canPrev()" aria-label="Older week">
      <i class="pi pi-chevron-left"></i>
    </button>
    <p-select [options]="options()"
              [ngModel]="selected()"
              (ngModelChange)="selected.set($event)"
              optionLabel="label"
              optionValue="value"
              appendTo="body"
              styleClass="week__picker" />
    <button pButton type="button" text size="small"
            (click)="next()" [disabled]="!canNext()" aria-label="Newer week">
      <i class="pi pi-chevron-right"></i>
    </button>
    <a routerLink="/library" pButton outlined size="small">Library</a>
  </app-page-header>

  @if (error(); as e) {
    <p class="week__error">{{ e }}</p>
  }

  @if (weekAnchor(); as anchor) {
    <app-trend-summary [anchor]="anchor" [days]="7" title="Momentum · this week" />
  }

  @if (loading() && !markdown()) {
    <div class="week__skeleton">
      <p-skeleton width="100%" height="9rem"></p-skeleton>
      <p-skeleton width="100%" height="9rem"></p-skeleton>
    </div>
  } @else if (markdown()) {
    <app-article-cards [source]="markdown()" />
  }
</section>
