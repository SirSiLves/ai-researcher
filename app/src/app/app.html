<div class="shell">
  <header class="topbar">
    <div class="topbar__inner">
      <a routerLink="/today" class="brand" aria-label="AI Researcher home">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">AI&nbsp;Researcher</span>
      </a>

      <nav class="nav" aria-label="Primary">
        @for (tab of tabs; track tab.path) {
          <a [routerLink]="tab.path"
             routerLinkActive="is-active"
             class="nav__link">{{ tab.label }}</a>
        }
      </nav>

      <div class="topbar__right">
        <button pButton
                type="button"
                text
                rounded
                size="small"
                class="theme-toggle"
                (click)="toggleTheme()"
                [attr.aria-label]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'"
                [title]="theme() === 'dark' ? 'Light mode' : 'Dark mode'">
          <i class="pi" [class.pi-sun]="theme() === 'dark'" [class.pi-moon]="theme() === 'light'"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <span>AI Researcher</span>
    <span class="muted">·</span>
    <span class="muted">Local feed</span>
    <span class="muted">·</span>
    <span class="muted">© {{ year }}</span>
  </footer>
</div>
