<div class="shell">
  <aside class="sidebar" aria-label="Primary">
    <a routerLink="/today" class="brand" aria-label="AI Researcher home">
      <span class="brand__mark" aria-hidden="true">AI</span>
      <span class="brand__text">Researcher</span>
    </a>

    <nav class="sidenav">
      @for (group of navGroups; track group.label) {
        <div class="sidenav__group">
          <div class="sidenav__group-label">{{ group.label }}</div>
          @for (tab of group.items; track tab.path) {
            <a [routerLink]="tab.path"
               routerLinkActive="is-active"
               class="sidenav__link">
              <i class="pi" [class]="'pi-' + tab.icon" aria-hidden="true"></i>
              <span>{{ tab.label }}</span>
            </a>
          }
        </div>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__inner">
        <span class="topbar__date tabular">{{ todayLabel }}</span>
        <button pButton
                type="button"
                text
                rounded
                size="small"
                class="theme-toggle"
                (click)="toggleTheme()"
                [attr.aria-label]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'"
                [title]="theme() === 'dark' ? 'Light mode' : 'Dark mode'">
          <i class="pi" [class.pi-sun]="theme() === 'dark'" [class.pi-moon]="theme() === 'light'"></i>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <router-outlet />
    </main>

    <footer class="colophon">
      <span class="colophon__title">AI//Researcher</span>
      <span class="colophon__sep">·</span>
      <span class="muted">v{{ volume }}.{{ issue }}</span>
      <span class="colophon__sep">·</span>
      <span class="muted">local feed</span>
      <span class="colophon__sep">·</span>
      <span class="muted">© {{ year }}</span>
    </footer>
  </div>
</div>
