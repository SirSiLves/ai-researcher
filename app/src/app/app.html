<div class="shell" [class.is-collapsed]="sidebarCollapsed()">
  <aside class="sidebar" aria-label="Primary">
    <div class="sidebar__head">
      <a routerLink="/pulse" class="brand" aria-label="Signal home">
        <span class="brand__mark" aria-hidden="true">
          <span class="brand__mark-dot"></span>
        </span>
        @if (!sidebarCollapsed()) {
          <span class="brand__text">
            <span class="brand__name">Signal</span>
            <span class="brand__sub">AI intelligence</span>
          </span>
        }
      </a>
      <button type="button"
              class="sidebar__toggle"
              (click)="toggleSidebar()"
              [pTooltip]="sidebarCollapsed() ? 'Expand' : 'Collapse'"
              tooltipPosition="right"
              [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
        <i class="pi" [class.pi-angle-double-left]="!sidebarCollapsed()" [class.pi-angle-double-right]="sidebarCollapsed()" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="sidenav">
      @for (tab of navTabs; track tab.path) {
        <a [routerLink]="tab.path"
           routerLinkActive="is-active"
           class="sidenav__link"
           [pTooltip]="sidebarCollapsed() ? tab.label + ' — ' + tab.hint : ''"
           tooltipPosition="right">
          <i class="pi" [class]="'pi-' + tab.icon" aria-hidden="true"></i>
          @if (!sidebarCollapsed()) {
            <span class="sidenav__link-body">
              <span class="sidenav__link-label">{{ tab.label }}</span>
              <span class="sidenav__link-hint">{{ tab.hint }}</span>
            </span>
          }
        </a>
      }
    </nav>

  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__inner">
        <span class="topbar__date tabular">{{ todayLabel }}</span>
        <button pButton
                type="button"
                text
                rounded
                size="small"
                class="theme-toggle"
                (click)="toggleTheme()"
                [attr.aria-label]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'"
                [title]="theme() === 'dark' ? 'Light mode' : 'Dark mode'">
          <i class="pi" [class.pi-sun]="theme() === 'dark'" [class.pi-moon]="theme() === 'light'"></i>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <router-outlet />
    </main>
  </div>
</div>
