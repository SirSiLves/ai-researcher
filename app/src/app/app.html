<header class="masthead">
  <div class="masthead__rules masthead__rules--top"></div>
  <div class="masthead__inner">
    <a routerLink="/today" class="wordmark" aria-label="AI Researcher home">
      <span class="wordmark__name">The&nbsp;AI Researcher</span>
      <span class="wordmark__sub">Daily dispatch from the AI frontier</span>
    </a>
    <div class="masthead__date">
      <time class="byline">{{ today() }}</time>
    </div>
  </div>
  <div class="masthead__rules masthead__rules--mid"></div>
  <nav class="topnav" aria-label="Primary">
    <ul>
      @for (tab of tabs; track tab.path) {
        <li>
          <a [routerLink]="tab.path"
             routerLinkActive="is-active"
             class="topnav__link">
            <i class="pi" [class]="tab.icon" aria-hidden="true"></i>
            <span>{{ tab.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
  <div class="masthead__rules masthead__rules--bottom"></div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="appfoot">
  <div class="appfoot__rules"></div>
  <div class="appfoot__inner">
    <span>The AI Researcher · Auto-generated nightly</span>
    <span class="muted">Editorial pipeline runs at 06:00 local</span>
  </div>
</footer>
